name: Local checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm test
      - run: npm run eval
      # No provider credentials or live model calls in CI.
